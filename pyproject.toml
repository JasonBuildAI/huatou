[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huatou"
version = "0.1.0"
description = "发言权管理器：现在能不能主动开口、答完要不要把话头递回去、这一句能不能出口"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools]
packages = ["huatou"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 这两个名字是「自动加载的第三方 pytest11 插件」里会在**收集之前**就崩掉的两个
# （本机装的 hydra_pytest 缺依赖、langsmith_plugin 版本不符）。按名字屏蔽在没装它们
# 的机器上是空操作，所以它既救本机也不影响 CI —— 换机时把这一行删掉再跑一遍。
addopts = '-p no:hydra_pytest -p no:langsmith_plugin -m "not meta"'
# 默认档不选元档，也不会为它多付那几秒。《最后的 -m》是命令行显式给的，
# 它会覆盖上面那一句，所以 `python -m pytest -m meta` 照样只跑元档。
markers = [
    "meta: 元档 —— 证明每条判据都能红；默认档不选它，`python -m pytest -m meta` 才跑",
]